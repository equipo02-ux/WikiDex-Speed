<!DOCTYPE html>
<html class="dark" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_stack" name="shell-type"/>
  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Outfit:wght@500;600;700;800&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html {
        width: 100%;
        overflow-y: auto;
        overflow-x: clip;
        margin: 0;
        padding: 0;
        background-color: #041329;
        color: #d6e3ff;
        font-family: 'Inter', sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        width: 100%;
        overflow-x: clip;
        overflow-y: visible;
        margin: 0;
        padding: 0;
        min-height: 100dvh;
        background-color: #041329;
        color: #d6e3ff;
        font-family: 'Inter', sans-serif;
      }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
    }
    ::-webkit-scrollbar { display: none; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "inverse-on-surface": "#233148",
            "on-error": "#690005",
            "secondary": "#fff0c8",
            "background": "#041329",
            "surface-container-lowest": "#010e24",
            "surface-variant": "#27354c",
            "surface-container-high": "#1c2a41",
            "on-primary": "#003548",
            "secondary-container": "#fdd000",
            "surface-bright": "#2c3951",
            "on-tertiary-fixed": "#011d35",
            "on-surface": "#d6e3ff",
            "tertiary": "#cce2ff",
            "on-secondary-fixed-variant": "#564500",
            "outline-variant": "#3e484e",
            "surface-container-low": "#0d1c32",
            "on-secondary": "#3b2f00",
            "primary-fixed-dim": "#73d1ff",
            "on-primary-fixed": "#001e2b",
            "inverse-primary": "#006687",
            "tertiary-fixed": "#d1e4ff",
            "on-secondary-container": "#6e5900",
            "surface": "#041329",
            "primary": "#bae6ff",
            "secondary-fixed-dim": "#ecc200",
            "surface-dim": "#041329",
            "on-tertiary-fixed-variant": "#314863",
            "on-background": "#d6e3ff",
            "on-secondary-fixed": "#231b00",
            "inverse-surface": "#d6e3ff",
            "primary-fixed": "#c1e8ff",
            "on-primary-container": "#005774",
            "tertiary-container": "#aec6e6",
            "tertiary-fixed-dim": "#b0c9e8",
            "surface-container-highest": "#27354c",
            "surface-tint": "#73d1ff",
            "error-container": "#93000a",
            "on-tertiary-container": "#3b526d",
            "on-surface-variant": "#bec8cf",
            "on-tertiary": "#19324b",
            "on-error-container": "#ffdad6",
            "error": "#ffb4ab",
            "primary-container": "#69cfff",
            "on-primary-fixed-variant": "#004d67",
            "secondary-fixed": "#ffe07c",
            "outline": "#889299",
            "surface-container": "#112036"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "space-xs": "0.25rem",
            "space-lg": "1rem",
            "space-sm": "0.5rem",
            "margin-lg": "1.5rem",
            "space-xl": "1.5rem",
            "gutter": "1rem",
            "space-md": "0.75rem",
            "margin": "1rem",
            "gutter-sm": "0.75rem"
          },
          fontFamily: {
            "headline-md": ["Outfit"],
            "label-sm": ["Outfit"],
            "headline-sm": ["Outfit"],
            "display-lg-mobile": ["Outfit"],
            "label-lg": ["Outfit"],
            "label-md": ["Outfit"],
            "body-md": ["Inter"],
            "body-sm": ["Inter"],
            "display-lg": ["Outfit"],
            "headline-lg": ["Outfit"],
            "body-lg": ["Inter"]
          },
          fontSize: {
            "headline-md": ["20px", { "lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "700" }],
            "label-sm": ["10px", { "lineHeight": "14px", "letterSpacing": "0.08em", "fontWeight": "700" }],
            "headline-sm": ["16px", { "lineHeight": "24px", "letterSpacing": "0.01em", "fontWeight": "600" }],
            "display-lg-mobile": ["30px", { "lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.04em", "fontWeight": "700" }],
            "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
            "body-md": ["14px", { "lineHeight": "22px", "letterSpacing": "0.01em", "fontWeight": "400" }],
            "body-sm": ["12px", { "lineHeight": "18px", "letterSpacing": "0.02em", "fontWeight": "400" }],
            "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "800" }],
            "headline-lg": ["26px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
            "body-lg": ["16px", { "lineHeight": "26px", "letterSpacing": "0em", "fontWeight": "400" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-fixed">
  <!-- Header -->
  <header class="fixed top-0 inset-x-0 z-50 pt-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.3)] border-b border-outline-variant/20">
    <div class="h-16 max-w-3xl mx-auto w-full px-4 sm:px-6 flex items-center justify-between gap-space-sm">
      <div class="flex items-center gap-space-xs min-w-0">
        <button aria-label="Volver" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:text-primary-container active:scale-95 transition-transform shrink-0" onclick="history.back()" type="button">
          <span class="material-symbols-outlined text-[24px]">arrow_back</span>
        </button>
        <div class="flex flex-col min-w-0">
          <h1 class="font-headline-sm text-headline-sm text-primary-container truncate leading-tight" id="header-char-title">Ficha de Personaje</h1>
          <span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider truncate" id="header-char-subtitle">WikiSpeed · Archivo Central</span>
        </div>
      </div>
      <div class="flex items-center gap-space-xs shrink-0">
        <a aria-label="Buscar en la wiki" class="w-10 h-10 flex items-center justify-center rounded-full text-primary-container hover:bg-surface-container active:scale-95 transition-all" href="/buscar">
          <span class="material-symbols-outlined text-[22px]">search</span>
        </a>
        <button aria-label="Cambiar idioma" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:text-on-surface hover:bg-surface-container active:scale-95 transition-all" type="button">
          <span class="material-symbols-outlined text-[20px]">translate</span>
        </button>
        <a aria-label="Perfil" class="w-9 h-9 rounded-full bg-primary flex items-center justify-center ml-1" href="/perfil">
          <span class="material-symbols-outlined text-on-primary text-[18px]">person</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex flex-col relative w-full pt-16 pb-24 bg-surface min-h-screen">
    <div class="w-full max-w-3xl mx-auto px-4 sm:px-6 flex flex-col gap-5 py-4">
      <!-- Roster Selector (Canon & No-Canon) -->
      <section class="flex flex-col gap-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span class="font-label-sm text-label-sm uppercase tracking-wider text-primary-fixed-dim" id="roster-heading">Selecciona un Personaje</span>
          <a class="font-label-sm text-label-sm text-secondary-container hover:underline flex items-center gap-1" href="/buscar">
            <span id="roster-search-link">Búsqueda y Filtros</span>
            <span class="material-symbols-outlined text-[14px]">arrow_forward</span>
          </a>
        </div>

        <!-- Canon / No-Canon Filter Bar -->
        <div class="flex items-center gap-2 flex-wrap" id="roster-filter-bar" role="tablist"></div>

        <!-- Scrollable / Grid Character Roster Cards -->
        <div class="flex gap-2.5 overflow-x-auto pb-1 snap-x snap-mandatory" id="character-roster-switcher"></div>
      </section>

      <!-- Dynamic Character Profile Container -->
      <div class="flex flex-col gap-5" id="character-sheet-root"></div>

      <!-- Localized Credits Section -->
      <section class="rounded-2xl bg-surface-container-low border border-secondary-container/30 p-4 sm:p-5 flex flex-col gap-3 shadow-md" id="credits-section">
        <div class="flex items-center gap-2 text-secondary-container">
          <span class="material-symbols-outlined text-[20px]">workspace_premium</span>
          <h2 class="font-headline-sm text-headline-sm text-on-surface" id="credits-heading">Créditos a los Creadores e Ilustradores de Sonic y sus Amigos</h2>
        </div>
        <p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed" id="credits-body"></p>
      </section>
    </div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_16px_rgba(0,0,0,0.4)]">
    <div class="h-16 max-w-3xl mx-auto px-2 flex items-center justify-around">
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="inicio" href="/">
        <span class="material-symbols-outlined text-[24px]">home</span>
        <span class="font-label-sm text-label-sm mt-0.5">Inicio</span>
      </a>
      <a aria-current="page" class="flex flex-col items-center justify-center w-16 h-12 text-primary-container transition-all" data-path="personajes" href="/personajes">
        <span class="material-symbols-outlined text-[24px]">group</span>
        <span class="font-label-sm text-label-sm mt-0.5">Personajes</span>
        <span class="w-1.5 h-1.5 rounded-full bg-primary-container mt-0.5 shadow-[0_0_8px_rgba(105,207,255,0.7)]"></span>
      </a>
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="medios" href="/medios">
        <span class="material-symbols-outlined text-[24px]">sports_esports</span>
        <span class="font-label-sm text-label-sm mt-0.5">Medios</span>
      </a>
      <a class="flex flex-col items-center justify-center w-16 h-12 text-on-surface-variant hover:text-on-surface transition-all" data-path="lore-y-mas" href="/lore-y-mas">
        <span class="material-symbols-outlined text-[24px]">auto_awesome</span>
        <span class="font-label-sm text-label-sm mt-0.5">Lore &amp; Más</span>
      </a>
    </div>
  </nav>

  <script>
    (function () {
      const DATA = window.WIKISPEED_DATA;
      if (!DATA) return;

      const root = document.getElementById('character-sheet-root');
      const headerTitle = document.getElementById('header-char-title');
      const headerSubtitle = document.getElementById('header-char-subtitle');
      const rosterHeading = document.getElementById('roster-heading');
      const rosterSearchLink = document.getElementById('roster-search-link');
      const rosterFilterBar = document.getElementById('roster-filter-bar');
      const rosterContainer = document.getElementById('character-roster-switcher');
      const creditsHeading = document.getElementById('credits-heading');
      const creditsBody = document.getElementById('credits-body');

      const favorites = new Set();
      let activeFilter = 'all'; // 'all' | 'canon' | 'nocanon'

      function resolveInitialCharacter() {
        const path = window.location.pathname.toLowerCase().replace(/\/+$/, '');
        const q = new URLSearchParams(window.location.search).get('id');
        const slug = (q || path.split('/').pop() || '').toLowerCase();
        if (DATA.CHARACTERS[slug]) return slug;
        return 'sonic';
      }

      let currentKey = resolveInitialCharacter();
      if (DATA.CHARACTERS[currentKey] && DATA.CHARACTERS[currentKey].canonType === 'nocanon') {
        activeFilter = 'all';
      }

      function getLang() {
        return DATA.getLang();
      }

      function getUI(lang) {
        return DATA.UI[lang] || DATA.UI['es-LA'];
      }

      function renderFilterBar(lang) {
        const ui = getUI(lang);
        const total = DATA.ORDER.length;
        const canonCount = DATA.ORDER.filter((k) => DATA.CHARACTERS[k].canonType === 'canon').length;
        const noCanonCount = DATA.ORDER.filter((k) => DATA.CHARACTERS[k].canonType === 'nocanon').length;

        const tabs = [
          { id: 'all', label: `${ui.filterAll} (${total})`, activeClass: 'bg-primary-container text-on-primary-fixed font-bold' },
          { id: 'canon', label: `${ui.filterCanon} (${canonCount})`, activeClass: 'bg-secondary-container text-on-secondary-fixed font-bold' },
          { id: 'nocanon', label: `${ui.filterNoCanon} (${noCanonCount})`, activeClass: 'bg-error text-on-error font-bold' }
        ];

        rosterFilterBar.innerHTML = tabs.map((t) => {
          const isActive = activeFilter === t.id;
          return `
            <button type="button" role="tab" aria-selected="${isActive}" data-roster-filter="${t.id}"
              class="px-3 py-1.5 rounded-lg text-label-md font-label-md transition-all active:scale-95 tabular-nums ${isActive ? t.activeClass : 'bg-surface-container text-on-surface-variant hover:bg-surface-container-high'}">
              ${t.label}
            </button>
          `;
        }).join('');

        rosterFilterBar.querySelectorAll('[data-roster-filter]').forEach((btn) => {
          btn.addEventListener('click', () => {
            activeFilter = btn.getAttribute('data-roster-filter');
            renderRoster(getLang());
            renderFilterBar(getLang());
          });
        });
      }

      function renderRoster(lang) {
        const ui = getUI(lang);
        const visibleKeys = DATA.ORDER.filter((k) => {
          const c = DATA.CHARACTERS[k];
          if (activeFilter === 'canon') return c.canonType === 'canon';
          if (activeFilter === 'nocanon') return c.canonType === 'nocanon';
          return true;
        });

        rosterContainer.innerHTML = visibleKeys.map((k) => {
          const c = DATA.CHARACTERS[k];
          const active = c.key === currentKey;
          const isNoCanon = c.canonType === 'nocanon';
          const ringClass = active
            ? (isNoCanon ? 'border-error shadow-[0_0_16px_rgba(255,180,171,0.3)]' : 'border-primary-container shadow-[0_0_16px_rgba(105,207,255,0.3)]')
            : 'border-outline-variant/25 hover:border-outline-variant/60';
          return `
            <button type="button" data-char="${c.key}"
              class="roster-card snap-start shrink-0 w-32 sm:w-36 group relative rounded-xl overflow-hidden bg-surface-container border-2 ${ringClass} text-left transition-all active:scale-[0.98]">
              <div class="relative aspect-[4/3] w-full overflow-hidden bg-surface-container-lowest">
                <img alt="${c.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" referrerpolicy="no-referrer" src="${c.heroImage}"/>
                <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/95 via-transparent to-transparent"></div>
                <span class="absolute bottom-1.5 left-2 right-2 font-headline-sm text-headline-sm text-white drop-shadow truncate">${c.shortName}</span>
              </div>
              <div class="px-2 py-1.5 flex items-center justify-between gap-1">
                <span class="font-label-sm text-label-sm ${c.accentClass} truncate">${c.code}</span>
                <span class="font-label-sm text-label-sm ${isNoCanon ? 'text-error' : 'text-on-surface-variant'} truncate">${isNoCanon ? ui.filterNoCanon : ui.filterCanon}</span>
              </div>
            </button>
          `;
        }).join('');

        rosterContainer.querySelectorAll('.roster-card').forEach((btn) => {
          btn.addEventListener('click', () => {
            const key = btn.getAttribute('data-char');
            renderCharacter(key, true);
            renderRoster(getLang());
          });
        });

        const activeCard = rosterContainer.querySelector(`[data-char="${currentKey}"]`);
        if (activeCard && typeof activeCard.scrollIntoView === 'function') {
          activeCard.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
      }

      function buildTailsSecretsHtml(ui) {
        return `
          <div class="mt-3 p-3.5 rounded-xl bg-surface-container-lowest/80 border border-outline-variant/30 font-body-md text-body-md text-on-surface-variant leading-relaxed">
            ${ui.tailsSecretsPrefix}
            <a href="/archivo-tails-doll" title="${ui.redRingHint}" class="inline-flex items-center gap-1 px-2 py-0.5 mx-0.5 rounded-md bg-red-950/75 hover:bg-red-900/85 border border-red-500/60 text-red-300 font-semibold align-baseline transition-colors">
              <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <circle cx="12" cy="12" r="8" stroke="#ef4444" stroke-width="3.4"/>
                <circle cx="12" cy="12" r="8" stroke="#fecaca" stroke-width="1" stroke-dasharray="7 18"/>
              </svg>
              <span>${ui.redRingLabel}</span>
            </a>
            ${ui.tailsSecretsMid}
            <a href="/archivo-el-primas" title="${ui.purpleEyeHint}" class="inline-flex items-center gap-1 px-2 py-0.5 mx-0.5 rounded-md bg-purple-950/75 hover:bg-purple-900/85 border border-purple-400/60 text-purple-200 font-semibold align-baseline transition-colors">
              <svg class="w-5 h-3.5 shrink-0" viewBox="0 0 30 20" fill="none" aria-hidden="true">
                <path d="M1.5 10 C6.5 2.5, 23.5 2.5, 28.5 10 C23.5 17.5, 6.5 17.5, 1.5 10 Z" fill="#1e1038" stroke="#c084fc" stroke-width="2"/>
                <circle cx="15" cy="10" r="4.8" fill="#a855f7"/>
                <circle cx="15" cy="10" r="2.1" fill="#090414"/>
                <circle cx="16.5" cy="8.5" r="0.9" fill="#ffffff"/>
              </svg>
              <span>${ui.purpleEyeLabel}</span>
            </a>
            ${ui.tailsSecretsSuffix}
          </div>
        `;
      }

      function renderCharacter(key, updateUrl) {
        const lang = getLang();
        const ui = getUI(lang);
        const c = DATA.CHARACTERS[key] || DATA.CHARACTERS.sonic;
        currentKey = c.key;

        const isNoCanon = c.canonType === 'nocanon';
        const alias = DATA.pick(c.alias, lang);
        const eraBadge = DATA.pick(c.eraBadge, lang);
        const artCredit = DATA.pick(c.artCredit, lang);
        const bio = DATA.pick(c.bio, lang);
        const historyArr = DATA.pick(c.history, lang) || [];

        headerTitle.textContent = `${c.shortName} — ${ui.techSheetTitle}`;
        headerSubtitle.textContent = ui.archiveSubtitle;
        rosterHeading.textContent = ui.selectChar;
        rosterSearchLink.textContent = ui.viewSearch;
        creditsHeading.textContent = ui.creditsHeading;
        creditsBody.textContent = ui.creditsBody;
        document.title = `${c.name} — WikiSpeed`;

        if (updateUrl) {
          window.history.replaceState(null, '', `/personajes/${c.key}`);
        }

        const isFav = favorites.has(c.key);

        root.innerHTML = `
          <!-- Sub-header & Favorite -->
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-1.5 text-on-surface-variant font-label-md text-label-md min-w-0">
              <span class="${c.accentClass} font-headline-sm text-headline-sm shrink-0">${c.code}</span>
              <span aria-hidden="true">·</span>
              <span class="tracking-wider uppercase truncate">${isNoCanon ? ui.communityArchive : ui.officialArchive}</span>
            </div>
            <button aria-label="${ui.favorite}" class="h-9 px-3 rounded-lg bg-surface-container hover:bg-surface-container-high flex items-center gap-1.5 text-secondary-container active:scale-95 transition-all shrink-0" id="fav-toggle-btn" type="button">
              <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' ${isFav ? 1 : 0};">favorite</span>
              <span class="font-label-sm text-label-sm uppercase">${isFav ? ui.saved : ui.favorite}</span>
            </button>
          </div>

          <!-- Hero Profile Banner with Name + Main 2D Fan-Art Image -->
          <section class="relative w-full rounded-2xl bg-surface-container-high border ${c.borderClass}/35 overflow-hidden shadow-xl">
            <div class="p-4 sm:p-5 flex flex-col gap-3.5">
              <div class="flex flex-wrap items-center gap-2 text-xs font-label-md text-on-surface-variant">
                <span class="${isNoCanon ? 'text-error' : 'text-primary-container'} font-bold">${isNoCanon ? ui.noCanonBadge : ui.canonBadge}</span>
                <span aria-hidden="true">·</span>
                <span>${eraBadge}</span>
                <span aria-hidden="true">·</span>
                <span class="tabular-nums">${c.debut}</span>
              </div>

              <div>
                <h2 class="font-headline-lg text-headline-lg text-on-surface tracking-tight leading-tight">${c.name}</h2>
                <p class="font-label-md text-label-md ${c.accentClass} mt-0.5">${c.jpName} <span class="text-outline">·</span> ${alias}</p>
              </div>

              <!-- Main Portrait Image WITH Character Name -->
              <div class="relative w-full aspect-video rounded-xl overflow-hidden bg-surface-container-lowest border border-outline-variant/25">
                <img alt="${c.name}" class="w-full h-full object-cover" referrerpolicy="no-referrer" src="${c.heroImage}"/>
                <div class="absolute inset-0 bg-gradient-to-t from-surface-container-lowest/90 via-transparent to-transparent"></div>
                <div class="absolute top-3 right-3 px-2.5 py-1 rounded-lg bg-surface-container-lowest/85 backdrop-blur-md flex items-center gap-1 ${c.accentClass}">
                  <span class="material-symbols-outlined text-[14px]">${c.metricIcon}</span>
                  <span class="font-label-sm text-label-sm font-bold">${c.metricText}</span>
                </div>
                <div class="absolute bottom-3 left-3 right-3 flex flex-wrap items-end justify-between gap-2">
                  <div class="px-3 py-1.5 rounded-lg bg-surface-container-lowest/85 backdrop-blur-md border border-outline-variant/30">
                    <span class="font-headline-sm text-headline-sm text-white block leading-tight">${c.name}</span>
                    <span class="font-body-sm text-body-sm text-primary/90 block leading-tight">${artCredit}</span>
                  </div>
                  <div class="px-2.5 py-1 rounded-lg bg-surface-container-lowest/85 backdrop-blur-md flex items-center gap-1 text-secondary-container">
                    <span class="material-symbols-outlined text-[15px]">${c.bottomTagIcon}</span>
                    <span class="font-label-sm text-label-sm font-bold">${c.bottomTagText}</span>
                  </div>
                </div>
              </div>

              <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${bio}</p>
              ${c.hasTailsSecrets ? buildTailsSecretsHtml(ui) : ''}
              ${c.dedicatedUrl ? `
                <div class="pt-1">
                  <a href="${c.dedicatedUrl}" class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl bg-error/15 hover:bg-error/25 border border-error/45 text-error font-label-md text-label-md font-bold transition-colors">
                    <span class="material-symbols-outlined text-[18px]">folder_open</span>
                    <span>${ui.openFullArchive}: ${c.shortName}</span>
                    <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
                  </a>
                </div>
              ` : ''}
            </div>
          </section>

          <!-- Historia Completa (Translated in 5 Languages) -->
          <section class="rounded-2xl bg-surface-container border border-outline-variant/25 p-4 sm:p-5 flex flex-col gap-3.5">
            <div class="flex items-center gap-2">
              <span class="material-symbols-outlined ${c.accentClass} text-[21px]">menu_book</span>
              <h3 class="font-headline-md text-headline-md text-on-surface">${ui.historyTitle} ${c.shortName}</h3>
            </div>
            <div class="flex flex-col gap-3">
              ${historyArr.map((chapter) => {
                const colonIdx = chapter.indexOf(':');
                const heading = colonIdx > 0 ? chapter.slice(0, colonIdx) : '';
                const body = colonIdx > 0 ? chapter.slice(colonIdx + 1).trim() : chapter;
                return `
                  <div class="p-3.5 rounded-xl bg-surface-container-low border border-outline-variant/20">
                    ${heading ? `<div class="font-label-lg text-label-lg ${c.accentClass} mb-1">${heading}</div>` : ''}
                    <p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">${body}</p>
                  </div>
                `;
              }).join('')}
            </div>
          </section>

          <!-- Estadísticas (Translated Stat Labels + tabular-nums) -->
          <section class="rounded-2xl bg-surface-container-high border border-outline-variant/20 p-4 sm:p-5 flex flex-col gap-4 shadow-md">
            <div class="flex items-center justify-between gap-2">
              <h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                <span class="material-symbols-outlined ${c.accentClass} text-[20px]">equalizer</span>
                ${ui.statsTitle} ${c.shortName}
              </h3>
              <span class="font-label-sm text-label-sm px-2.5 py-1 rounded-md bg-surface-container-highest text-secondary-container tabular-nums">${c.rank}</span>
            </div>
            <div class="flex flex-col gap-3 tabular-nums">
              ${c.stats.map((s) => `
                <div class="flex flex-col gap-1">
                  <div class="flex justify-between items-center font-label-md text-label-md gap-2">
                    <span class="text-on-surface-variant flex items-center gap-1.5 min-w-0">
                      <span class="material-symbols-outlined text-[16px] ${c.accentClass} shrink-0">${s.icon}</span>
                      <span class="truncate">${DATA.statLabel(s.statKey, lang)}</span>
                    </span>
                    <span class="text-on-surface font-bold shrink-0">${s.suffix}</span>
                  </div>
                  <div class="w-full h-3 rounded-full bg-surface-container-lowest overflow-hidden">
                    <div class="h-full rounded-full ${s.bar}" style="width: ${s.pct}%"></div>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="bg-surface-container-low p-3 rounded-xl">
              <span class="font-label-sm text-label-sm text-outline uppercase tracking-wider block mb-2">${ui.movesTitle} ${c.shortName}</span>
              <div class="flex flex-wrap gap-1.5">
                ${c.moves.map((m) => `<span class="px-2.5 py-1 rounded-lg bg-surface-variant text-on-surface font-label-md text-label-md">${m}</span>`).join('')}
              </div>
            </div>
          </section>

          <!-- Galería Fan-Art -->
          <section class="rounded-2xl bg-surface-container border border-outline-variant/20 p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-2">
                <span class="material-symbols-outlined ${c.accentClass} text-[20px]">palette</span>
                ${ui.galleryTitle} ${c.shortName}
              </h3>
              <span class="font-label-sm text-label-sm text-outline uppercase tabular-nums">${c.gallery.length} ${ui.illustrations}</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${c.gallery.map((g) => `
                <figure class="rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant/25 flex flex-col">
                  <div class="relative aspect-video w-full bg-surface-container-lowest overflow-hidden">
                    <img alt="${g.label}" class="w-full h-full object-cover" referrerpolicy="no-referrer" src="${g.img}"/>
                    <span class="absolute top-2 left-2 px-2 py-0.5 rounded bg-surface-container-lowest/85 backdrop-blur-sm font-label-sm text-label-sm text-primary-container">${g.tag}</span>
                  </div>
                  <figcaption class="px-3 py-2 font-label-md text-label-md text-on-surface">${g.label}</figcaption>
                </figure>
              `).join('')}
            </div>
          </section>

          <!-- Ficha Técnica -->
          <section class="rounded-2xl bg-surface-container border border-outline-variant/20 p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between bg-surface-container-high/60 px-3 py-2 rounded-lg">
              <div class="flex items-center gap-2 text-primary-fixed">
                <span class="material-symbols-outlined text-[18px]">badge</span>
                <span class="font-headline-sm text-headline-sm">${ui.techSheetTitle}</span>
              </div>
              <span class="font-label-sm text-label-sm text-on-surface-variant uppercase">${isNoCanon ? ui.filterNoCanon : 'SEGA Archive'}</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <div class="bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.species}</span>
                <span class="font-headline-sm text-headline-sm text-on-surface">${DATA.pick(c.specs.species, lang)}</span>
              </div>
              <div class="bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.ageGender}</span>
                <span class="font-headline-sm text-headline-sm text-on-surface">${DATA.pick(c.specs.ageGender, lang)}</span>
              </div>
              <div class="bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.size}</span>
                <span class="font-body-md text-body-md font-semibold text-on-surface tabular-nums">${c.specs.size}</span>
              </div>
              <div class="bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.alignment}</span>
                <span class="font-body-md text-body-md font-semibold text-secondary-fixed">${DATA.pick(c.specs.alignment, lang)}</span>
              </div>
              <div class="sm:col-span-2 bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.ability}</span>
                <span class="font-body-md text-body-md ${c.accentClass}">${DATA.pick(c.specs.ability, lang)}</span>
              </div>
              <div class="sm:col-span-2 bg-surface-container-low p-2.5 rounded-lg flex flex-col">
                <span class="font-label-sm text-label-sm text-outline uppercase">${ui.creators}</span>
                <span class="font-body-md text-body-md text-on-surface">${c.specs.creators}</span>
              </div>
            </div>
          </section>

          <!-- Juegos Clave & Doblaje -->
          <section class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="rounded-2xl bg-surface-container border border-outline-variant/20 p-4 flex flex-col gap-2.5">
              <h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1.5">
                <span class="material-symbols-outlined text-primary-container text-[18px]">sports_esports</span>
                ${ui.keyGames}
              </h3>
              ${c.games.map((g) => `
                <div class="p-2.5 rounded-xl bg-surface-container-low flex items-center justify-between gap-2">
                  <div class="min-w-0">
                    <div class="font-label-lg text-label-lg text-on-surface truncate">${g.title}</div>
                    <div class="font-body-sm text-body-sm text-on-surface-variant">${g.sub}</div>
                  </div>
                  <span class="px-2 py-0.5 rounded bg-surface-container-highest text-secondary-container font-label-sm text-label-sm shrink-0">${g.tag}</span>
                </div>
              `).join('')}
            </div>

            <div class="rounded-2xl bg-surface-container border border-outline-variant/20 p-4 flex flex-col gap-2.5">
              <h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1.5">
                <span class="material-symbols-outlined text-secondary-container text-[18px]">record_voice_over</span>
                ${ui.voiceActors}
              </h3>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                ${c.voices.map((v) => `
                  <div class="p-2.5 rounded-xl bg-surface-container-low flex flex-col">
                    <span class="font-label-sm text-label-sm text-outline">${v.lang}</span>
                    <span class="font-label-lg text-label-lg text-on-surface leading-snug">${v.actor}</span>
                    <span class="font-body-sm text-body-sm text-on-surface-variant">${v.note}</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </section>

          <!-- Transformaciones -->
          <section class="rounded-2xl bg-surface-container border border-outline-variant/20 p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
              <h3 class="font-headline-sm text-headline-sm text-on-surface flex items-center gap-1.5">
                <span class="material-symbols-outlined text-secondary-container text-[20px]">auto_awesome</span>
                ${ui.transformsTitle} ${c.shortName}
              </h3>
              <span class="font-label-sm text-label-sm text-outline uppercase">Chaos Energy</span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              ${c.transforms.map((t) => `
                <div class="p-3 rounded-xl bg-surface-container-high flex flex-col items-center text-center gap-1">
                  <span class="material-symbols-outlined text-[24px] ${t.tone}">${t.icon}</span>
                  <span class="font-label-lg text-label-lg text-on-surface">${t.name}</span>
                  <span class="font-body-sm text-body-sm text-on-surface-variant">${t.req}</span>
                </div>
              `).join('')}
            </div>
          </section>
        `;

        const favBtn = document.getElementById('fav-toggle-btn');
        if (favBtn) {
          favBtn.addEventListener('click', () => {
            if (favorites.has(c.key)) favorites.delete(c.key);
            else favorites.add(c.key);
            renderCharacter(c.key, false);
          });
        }
      }

      function renderAll() {
        const lang = getLang();
        renderFilterBar(lang);
        renderRoster(lang);
        renderCharacter(currentKey, false);
      }

      window.addEventListener('wikispeed:langchange', () => {
        renderAll();
      });

      renderAll();
    })();
  </script>
</body>
</html>
