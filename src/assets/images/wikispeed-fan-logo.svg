<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="WikiSpeed Fan Emblem">
  <defs>
    <linearGradient id="ringGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff099"/>
      <stop offset="50%" stop-color="#fdd000"/>
      <stop offset="100%" stop-color="#d48a00"/>
    </linearGradient>
    <linearGradient id="sonicBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69cfff"/>
      <stop offset="55%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0a3a8a"/>
    </linearGradient>
  </defs>
  <!-- Hand-inked Outer Golden Ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#010e24" stroke-width="9"/>
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ringGold)" stroke-width="5.5"/>
  <path d="M18 17 A21 21 0 0 1 40 12" fill="none" stroke="#fff9d6" stroke-width="2" stroke-linecap="round"/>
  <!-- Hand-drawn Sonic Quills / Speed Wing -->
  <path d="M10 34 C18 22, 33 14, 52 15 C44 21, 41 25, 48 27 C39 30, 36 33, 45 37 C34 39, 25 42, 16 49 C20 42, 17 37, 10 34 Z"
        fill="url(#sonicBlue)" stroke="#010e24" stroke-width="2.6" stroke-linejoin="round"/>
  <!-- Speed Bolt Highlight -->
  <path d="M22 33 L35 23 L31 30 L42 29 L26 42 L30 34 Z"
        fill="#fdd000" stroke="#010e24" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Sparkle Star -->
  <path d="M51 45 L53 49 L57 51 L53 53 L51 57 L49 53 L45 51 L49 49 Z"
        fill="#fff099" stroke="#010e24" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
